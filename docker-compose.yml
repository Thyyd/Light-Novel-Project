services:
  postgres:
    image: postgres:16
    container_name: lightverse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lightverse
    ports:
      - "5432:5432"
    volumes:
      - lightverse_postgres_data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16
    container_name: lightverse_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: lightverse_test
    ports:
      - "5433:5432"

volumes:
  lightverse_postgres_data: