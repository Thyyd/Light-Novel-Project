<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;">Maquette mobile de la page Profil LightVerse, avec photo de profil modifiable, pseudo, date d'inscription, champ nom d'utilisateur, adresse e-mail fixe, bouton sauvegarder, et bloc de changement de mot de passe.</h2>
<div style="max-width:380px;margin:0 auto;background:#F8F4EE;border-radius:20px;overflow:hidden;font-family:'Manrope',sans-serif;">

  <div style="background:#0F3ED9;padding:14px 16px;display:flex;align-items:center;gap:12px;">
    <i class="ti ti-chevron-left" style="color:#fff;font-size:22px;" aria-hidden="true"></i>
    <span style="color:#fff;font-size:14px;font-weight:600;">Mon profil</span>
  </div>

  <div style="padding:26px 16px 24px;">

    <div style="display:flex;flex-direction:column;align-items:center;">
      <div style="position:relative;">
        <div style="width:88px;height:88px;border-radius:50%;background:#5A4A85;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(120,95,60,0.14);">
          <i class="ti ti-user" style="color:#E8E3F5;font-size:38px;" aria-hidden="true"></i>
        </div>
        <div style="position:absolute;bottom:-2px;right:-2px;width:28px;height:28px;border-radius:50%;background:#1996FF;border:2.5px solid #F8F4EE;display:flex;align-items:center;justify-content:center;">
          <i class="ti ti-camera" style="color:#fff;font-size:13px;" aria-hidden="true"></i>
        </div>
      </div>
      <h1 style="font-family:'Spectral',serif;font-weight:600;font-size:18px;color:#1A1A1A;margin:12px 0 2px;">Yumi_reads</h1>
      <p style="font-size:11.5px;color:#9A9A9A;margin:0;">Membre depuis mars 2024</p>
    </div>

    <div style="margin-top:26px;background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 6px rgba(120,95,60,0.14);">
      <label style="display:block;font-size:11.5px;color:#6B6B6B;font-weight:500;margin-bottom:6px;">Nom d'utilisateur</label>
      <div style="display:flex;align-items:center;border:1px solid #D8D2C4;border-radius:10px;padding:10px 12px;margin-bottom:16px;background:#fff;">
        <input type="text" value="Yumi_reads" style="border:0;outline:0;flex:1;font-size:13px;font-family:'Manrope',sans-serif;color:#1A1A1A;background:transparent;">
        <i class="ti ti-pencil" style="color:#9A9A9A;font-size:15px;" aria-hidden="true"></i>
      </div>

      <label style="display:block;font-size:11.5px;color:#6B6B6B;font-weight:500;margin-bottom:6px;">Adresse e-mail</label>
      <div style="display:flex;align-items:center;border:1px solid #E2DCCC;border-radius:10px;padding:10px 12px;margin-bottom:18px;background:#F3EFE6;">
        <input type="text" value="yumi.reads@email.com" disabled style="border:0;outline:0;flex:1;font-size:13px;font-family:'Manrope',sans-serif;color:#9A9A9A;background:transparent;">
        <i class="ti ti-lock" style="color:#B9B2A0;font-size:14px;" aria-hidden="true"></i>
      </div>

      <button style="width:100%;background:#1FAE57;color:#fff;border:0;border-radius:10px;padding:11px;font-size:13.5px;font-weight:600;font-family:'Manrope',sans-serif;">Enregistrer</button>
    </div>

    <div style="margin-top:16px;background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 6px rgba(120,95,60,0.14);">
      <h2 style="font-family:'Spectral',serif;font-weight:500;font-size:14.5px;color:#1A1A1A;margin:0 0 14px;display:flex;align-items:center;gap:6px;">
        <i class="ti ti-shield-lock" style="color:#5A4A85;font-size:16px;" aria-hidden="true"></i>
        Changer le mot de passe
      </h2>

      <label style="display:block;font-size:11.5px;color:#6B6B6B;font-weight:500;margin-bottom:6px;">Mot de passe actuel</label>
      <div style="border:1px solid #D8D2C4;border-radius:10px;padding:10px 12px;margin-bottom:12px;">
        <input type="password" value="••••••••" style="border:0;outline:0;width:100%;font-size:13px;font-family:'Manrope',sans-serif;color:#1A1A1A;background:transparent;">
      </div>

      <label style="display:block;font-size:11.5px;color:#6B6B6B;font-weight:500;margin-bottom:6px;">Nouveau mot de passe</label>
      <div style="border:1px solid #D8D2C4;border-radius:10px;padding:10px 12px;margin-bottom:12px;">
        <input type="password" placeholder="••••••••" style="border:0;outline:0;width:100%;font-size:13px;font-family:'Manrope',sans-serif;color:#1A1A1A;background:transparent;">
      </div>

      <label style="display:block;font-size:11.5px;color:#6B6B6B;font-weight:500;margin-bottom:6px;">Confirmer le nouveau mot de passe</label>
      <div style="border:1px solid #D8D2C4;border-radius:10px;padding:10px 12px;margin-bottom:18px;">
        <input type="password" placeholder="••••••••" style="border:0;outline:0;width:100%;font-size:13px;font-family:'Manrope',sans-serif;color:#1A1A1A;background:transparent;">
      </div>

      <button style="width:100%;background:#1996FF;color:#fff;border:0;border-radius:10px;padding:11px;font-size:13.5px;font-weight:600;font-family:'Manrope',sans-serif;">Mettre à jour le mot de passe</button>
    </div>

  </div>
</div>
